spring:
  application:
    name: git-pr
  
  server:
    port: 8080

  datasource:
    url: ${DB_URL} 
    username: ${DB_USER}   
    password: ${DB_PASSWORD}    

  jpa:
    hibernate:
      ddl-auto: validate  
    show-sql: true  

  flyway:
    enabled: true 
    out-of-order: false  
    locations:
      - classpath:db/migration  
  shell:
    enabled: false  

embabel:
  agent:
    platform:
      models:
        googlegenai:
          api-key: ${GOOGLE_API_KEY}
          max-attempts: 10
          backoff-millis: 5000


  models:
    default-llm: gemini-2.5-flash
    llms:
      fast: gemini-2.5-flash
      best: gemini-2.5-pro


github:
  token: ${GITHUB_TOKEN}
  webhook:
    secret: ${GITHUB_WEBHOOK_SECRET}
